services:
  mysql:
    image: mysql:latest
    container_name: tracky_db
    ports:
      - "3316:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=mysql
    volumes:
      - tracky_db:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      ./backend/.
    container_name: tracky_backend
    ports:
      - "8010:8080"
    networks:
      - app-network
    restart: unless-stopped
  
  frontend:
    build:
      ./frontend/
    container_name: tracky
    ports:
      - "3000:80"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
volumes:
  tracky_db: