<script>
  $(document).ready(function () {
    showHeader();
  });
  $(window).on("headerUpdate", function (){
    showHeader();
  });

  function showHeader() {
    if (window.sessionStorage.getItem("sessionToken")) {
      $("nav").removeClass("hide");
      $("#profile").removeClass("hide");
    }
    else {
      $("nav").addClass("hide");
      $("#profile").addClass("hide");
    }
  }
</script>

<div id="headerContainer">
  <div id="pageTitle">
    <p>_Tracky</p>
  </div>
  <nav>
    <a onclick="GotoPage('overview.html')">Overview</a>
    <a onclick="GotoPage('budgets.html')">Budgets</a>
  </nav>
  <div id="profile">
    <a onclick="GotoPage('logout.html')">Sign out</a>
  </div>
</div>
