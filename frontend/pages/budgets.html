<script>
  function show(idx) {
    // hide all except idx
    const content = document.getElementById("page-view").children;
    for (let i = 0; i < content.length; i++) {
      content[i].classList.add("hide");
    }
    content[idx].classList.remove("hide");
  }

  function show_hideForm(is_edit = false) {
    if (!$("#budget-form").hasClass("hide")) {
      $("#budget-form").addClass("hide");
    } else {
      $("#budget-form").removeClass("hide");
    }

    if (is_edit) {
      $("#itemcreatebtn").text("Edit item");
    } else {
      $("#itemcreatebtn").text("Create item");
    }
  }

  $(document).ready(function () {
    show(0);
  });
</script>

<div id="budget">
  <div id="topbar">
    <a onclick="show(0)">Budgets</a>
    <a onclick="show(1)">Groups</a>
  </div>
  <div id="content">
    <div id="page-view">
      <div id="budget-view" class="">
        <div id="budget-form" class="">
          <div id="form">

            </div>
            
            <p id="form-error" class="noError">Error</p>
            <div>

              <button id="itemcreatebtn">Create item</button>
            </div>
          </div>
        </div>
        <div id="budget-list">
          <button onclick="show_hideForm()" id="new-btn">New budget</button>
