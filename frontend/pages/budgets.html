<script>
  function show(idx) {
    // hide all except idx
    const content = document.getElementById("page-view").children;
    for (let i = 0; i < content.length; i++) {
      content[i].classList.add("hide");
    }
    content[idx].classList.remove("hide");
  }

  $(document).ready(function () {
    show(0);
  });
</script>

<div id="budget">
  <div id="topbar">
    <a onclick="show(0)">Budgets</a>
    <a onclick="show(1)">Groups</a>
  </div>
  <div id="content">
    <div id="page-view">
      <div id="budget-view">
        <div id="budget-list">
          <button id="new-btn">New budget</button>
          <div id="list">
            <a><span></span>Living basics</a>
            <a><span></span>Gifts</a>
          </div>
        </div>
        <div id="selected-budget">
          <div id="selected-menu">
            <button>Add item</button>
          </div>
          <div id="selected-view"></div>
        </div>
      </div>
      <div id="groups-view" class="hide"></div>
    </div>
  </div>
</div>
