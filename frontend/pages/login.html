<script>
  const btn_login = document.getElementById("login_btn");
  const login_form = document.getElementById("login-form");
  const btn_register = document.getElementById("create_account");
  const register_form = document.getElementById("register-form");

  function Goto(form) {
    if (form === "login") {
      login_form.classList.remove("CloseForm");
      register_form.classList.add("CloseForm");
    }
    if (form === "register") {
      login_form.classList.add("CloseForm");
      register_form.classList.remove("CloseForm");
    }
  }

  //Login
  document.getElementById("gotoRegister").addEventListener("click", () => {
    // btn_login for actual log in
    Goto("register");
  });
  //Register
  document.getElementById("gotoLogin").addEventListener("click", () => {
    // btn_register for creating account
    Goto("login");
  });
</script>

<div class="content" id="login-page">
  <div id="login-form" class="OpenForm CloseForm">
    <div id="form-inputs">
      <input type="text" />
      <input type="text" />
    </div>
    <button id="login_btn">Log in</button>
    <button id="gotoRegister">Create account</button>
  </div>
  <div id="register-form" class="OpenForm">
    <div id="form-inputs">
      <input type="text" />
      <input type="text" />
      <input type="text" />
    </div>
    <button id="create_account">Create account</button>
    <button id="gotoLogin">Already have an account</button>
  </div>
</div>
