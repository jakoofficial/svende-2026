<script>
  function Goto(form) {
    if (form === "login") {
      document.getElementById("login-form").classList.remove("CloseForm");
      document.getElementById("register-form").classList.add("CloseForm");
    }
    if (form === "register") {
      document.getElementById("login-form").classList.add("CloseForm");
      document.getElementById("register-form").classList.remove("CloseForm");
    }
  }
  $("#login_btn").click(function () {
    window.sessionStorage.setItem("sessionToken", "TesterToken");
    GotoPage("overview.html");
    $(window).trigger($.Event("headerUpdate"));
  });
  //Login
  document.getElementById("gotoRegister").addEventListener("click", () => {
    Goto("register");
  });
  //Register
  document.getElementById("gotoLogin").addEventListener("click", () => {
    Goto("login");
  });
</script>

<div class="content" id="login-page">
  <div id="login-form" class="OpenForm CloseForm">
    <h1>Log in</h1>
    <div id="form-inputs">
      <div>
        <p>Username</p>
        <input type="text" />
      </div>
      <div>
        <p>Password</p>
        <input type="password" />
      </div>
    </div>
    <button id="login_btn">Log in</button>
    <button id="gotoRegister">Create account</button>
  </div>
  <div id="register-form" class="OpenForm">
    <div id="form-inputs">
      <h1>Register</h1>
      <div>
        <p>Username</p>
        <input type="text" />
      </div>
      <div>
        <p>Password</p>
        <input type="password" />
      </div>
      <div>
        <p>Confirm password</p>
        <input type="password" />
      </div>
    </div>
    <button id="create_account">Create account</button>
    <button id="gotoLogin">Already have an account</button>
  </div>
</div>
