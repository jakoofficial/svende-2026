<script>
  function show(idx) {
    // hide all except idx
    const content = document.getElementById("overview-content").children;
    for (let i = 0; i < content.length; i++) {
      if (!content[i].classList.contains("hide")) {
        content[i].classList.add("hide");
      }
    }
    content[idx].classList.remove("hide");
  }
  show(0);
</script>

<div class="content" id="overview">
  <div id="topbar">
    <a onclick="show(0)">Items</a>
    <a onclick="show(1)">Graph view</a>
    <a onclick="show(2)">List view</a>
  </div>
  <div id="overview-content">
    <div id="items">hello</div>
    <div id="graphview">i am </div>
    <div id="listview">a list</div>
  </div>
</div>

<style>
  #overview {
    width: 95vw;
    height: 90vh;
    margin: 0px auto;
    border: 1px solid red;

    .hide {
      display: none;
      visibility: collapse;
    }

    #topbar {
      background-color: rgba(56, 60, 65, 0.349);
      width: 25%;

          background-color: #1616169a;
        }
      }
    }
  }
</style>
