<script>
  function show(idx) {
    // hide all except idx
    const content = document.getElementById("overview-content").children;
    for (let i = 0; i < content.length; i++) {
      if (!content[i].classList.contains("hide")) {
        content[i].classList.add("hide");
      }
    }
    content[idx].classList.remove("hide");
  }
  show(0);
</script>

<div class="content" id="overview">
  <div id="topbar">
    <a onclick="show(0)">Items</a>
    <a onclick="show(1)">Graph view</a>
    <a onclick="show(2)">List view</a>
  </div>
  <div id="overview-content">
    <div id="items">
      <div id="itemsMenu">
        <button>New item</button>
      </div>
      <div id="itemlist">
        <div class="itemblock">
          <p>ItemName</p>
          <p>ItemDescription</p>
          <p>Price</p>
          <p>Date</p>
          <button>Edit</button>
          <button>Remove</button>
        </div>
      </div>
    </div>
    <div id="graphview">
      <div id="graph">i am</div>
    </div>
    <div id="listview">
      <div id="list">a list</div>
    </div>
  </div>
</div>
