<script src="../../node_modules/chart.js/dist/chart.umd.min.js"></script>
<script>
  function show(idx) {
    // hide all except idx
    const content = document.getElementById("overview-content").children;
    for (let i = 0; i < content.length; i++) {
      content[i].classList.add("hide");
    }
    content[idx].classList.remove("hide");
  }

  $(document).ready(function () {
    show(0);
    // Charts
    const ctx = document.getElementById("myChart");

    new Chart(ctx, {
      type: "line",
      data: {
        labels: [
          "January",
          "Feburary",
          "March",
          "April",
          "May",
          "July",
          "June",
        ],
        datasets: [
          {
            label: "Monthly usage",
            data: [12, 19, 3, 5, 2, 3],
            borderWidth: 1,
          },
        ],
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
          },
        },
      },
    });
  });
</script>

<div class="content" id="overview">
  <div id="topbar">
    <a onclick="show(0)">Overview</a>
    <a onclick="show(1)">Items</a>
  </div>
  <div id="overview-content">
    <div id="overview-page">
      <div id="view">
        <div id="top">
          <div class="topcontainer">
            <p>Monthly</p>
            <p><span>Allocated:</span> 200,-</p>
            <p>Used:<span> 250,-</span></p>
          </div>
          <div class="topcontainer">

            <p>Used:<span> 25,-</span></p>
          </div>
        </div>
        <div id="listview">
          <canvas id="myChart"></canvas>
        </div>
      </div>
    </div>
    <div id="items" class="hide">
